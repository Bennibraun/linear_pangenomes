name: linear-pangenomes-sv-calling
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pysam
  - minimap2
  - samtools >=1.9
  - bcftools >=1.9
  - htslib  # tabix/bgzip for re-genotyping rules
  - sniffles
  - cutesv
  - cutefc  # force-calling/re-genotyping an existing SV VCF from reads
  - survivor
  - jasminesv
  - cd-hit

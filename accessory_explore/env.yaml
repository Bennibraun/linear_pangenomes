# Standalone conda env for the accessory-sequence exploration (NOT part of the
# Snakemake pipeline -- this is one-off characterisation for the paper).
#
#   conda env create -f env.yaml
#   conda activate accessory-explore
#
# Tools:
#   blast          -> dustmasker (low-complexity/repeat masking), makeblastdb
#   diamond        -> fast protein search (blastx) of accessory contigs
#   seqkit         -> FASTA stats / subsetting / length tables
#   samtools       -> faidx and general FASTA handling
#   bedtools       -> interval math on masked regions
#   pandas/numpy   -> the population-overlay analysis script
#   pysam          -> reading the merged VCF for per-contig presence/absence
name: accessory-explore
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - blast >=2.14      # dustmasker + makeblastdb
  - diamond >=2.1
  - seqkit >=2.5
  - samtools >=1.17
  - bedtools >=2.31
  - pandas >=2.0
  - numpy >=1.24
  - pysam >=0.22

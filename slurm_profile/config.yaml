executor: slurm

default-resources:
  - cpus=2
  - mem_mb=5000
  - runtime=60
  - slurm_partition=short

resources:
  - threads=100
  - mem_mb=500000   # 500gb

jobs: 100
latency-wait: 60
max-jobs-per-second: 5
max-status-checks-per-second: 1
keep-going: true
rerun-incomplete: true
printshellcmds: true
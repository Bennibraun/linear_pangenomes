executor: slurm
cores: 100

default-resources:
  - cpus=2
  - mem_mb=5000
  - runtime=3600
  - slurm_partition=short

resources:
  - cpus=100        # total CPUs across all running jobs (highmem ceiling)
  - mem_mb=500000   # 500 GB

slurm-partition-config: partitions.yaml

# jobs: 100
jobs: 6
latency-wait: 60
max-jobs-per-second: 5
max-status-checks-per-second: 1
keep-going: true
rerun-incomplete: true
# rerun-triggers:
  # - mtime
printshellcmds: true
singularity-args: "--bind /scratch,/Users"